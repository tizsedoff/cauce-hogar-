<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Catálogo — CAUCE hogar (Preview)</title>
<meta name="description" content="Catálogo de lámparas de pared CAUCE hogar: individuales y packs, con control remoto.">
<meta name="theme-color" content="#1b1511">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalogo">
<main>
<div class="pagehead"><div class="crumb"><a href="index.html">Inicio</a><span>/</span>Catálogo</div><h1 class="t" style="font-family:var(--serif);font-weight:300;font-size:clamp(40px,6vw,88px);line-height:1;color:var(--umber)">Catálogo de <em style="color:var(--brick)">lámparas</em></h1><p class="lead">Lámparas de pared magnéticas, con control remoto y tres intensidades. Elegí la tuya.</p></div>
<section class="s alt" style="padding-top:44px">
  <div class="toolbar">
    <div class="chips" id="chips"><button class="chip on" data-f="all">Todas</button><button class="chip" data-f="individual">Individuales</button><button class="chip" data-f="pack">Packs</button></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input class="fld" id="q" type="search" placeholder="Buscar lámpara" aria-label="Buscar">
      <select class="fld" id="col" aria-label="Color"><option value="all">Todos los colores</option><option value="black">Negra</option><option value="white">Blanca</option></select>
      <select class="fld" id="sort" aria-label="Ordenar"><option value="feat">Destacadas</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option></select>
    </div>
  </div>
  <div class="count" id="count" style="margin-bottom:20px"></div>
  <div class="grid" id="grid"></div>
  <p class="note">Precios, packs y stock de ejemplo para esta preview. Se actualizan con los datos reales del negocio al publicar.</p>
</section>
</main>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/art.js"></script>
<script src="js/layout.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
